<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIZZA RUSH AI CAMPAIGN DEMO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link
    rel="icon"
    type="image/png"
    href="https://ctovmhwxjuehichrydrl.supabase.co/storage/v1/object/public/Imagaes/android-chrome-512x512.png"
    sizes="512x512"
  />
  <style>
    :root {
      --bg: #0f180f;
      --panel: #d8e4cc;
      --border: #070707;
      --screen: #c6d7ad;
      --text: #070707;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem 3rem;
      background: var(--bg);
      color: var(--panel);
      font-family: 'Press Start 2P', 'VT323', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(0.72rem, 2.9vw, 1.08rem);
      color: #dcdcdc;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .game-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    canvas {
      width: min(92vw, 472px);
      aspect-ratio: 10 / 9;
      image-rendering: pixelated;
      border: 2px solid #000;
      background: #2d2d1f;
      box-shadow: 0 0 0 8px #1a1a1a;
    }

    .replay {
      display: none;
      border: 4px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.75rem;
      text-transform: inherit;
      letter-spacing: inherit;
      transition: transform 0.1s ease;
    }

    .replay:active {
      transform: translateY(2px);
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, clamp(40px, 15vw, 54px));
      grid-template-areas:
        '. up .'
        'left . right'
        '. down .';
      width: min(88vw, 352px);
      gap: 0.55rem;
      margin-top: 0.5rem;
      touch-action: none;
    }

    .dpad-button {
      border: 2px solid #000;
      background: #cfd2b2;
      color: var(--text);
      font-family: inherit;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 -3px 0 rgba(7, 7, 7, 0.35);
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .dpad-button:focus {
      outline: none;
      box-shadow: inset 0 -4px 0 rgba(7, 7, 7, 0.35), 0 0 0 3px rgba(7, 7, 7, 0.45);
    }

    .dpad-button:active,
    .dpad-button.pressed {
      transform: translateY(2px);
      box-shadow: inset 0 3px 0 rgba(7, 7, 7, 0.35);
    }

    .dpad-button.up {
      grid-area: up;
    }

    .dpad-button.left {
      grid-area: left;
    }

    .dpad-button.right {
      grid-area: right;
    }

    .dpad-button.down {
      grid-area: down;
    }

    .disclaimer {
      font-size: clamp(0.28rem, 1.2vw, 0.45rem);
      text-align: center;
      color: #dcdcdc;
      opacity: 0.7;
      text-transform: none;
      letter-spacing: 1px;
      margin: 0.4rem 0 0;
    }

    @media (max-width: 540px) {
      canvas,
      .dpad {
        width: min(92vw, 360px);
      }
    }
  </style>
</head>
<body>
  <div class="title-block">
    <h1>PIZZA RUSH AI CAMPAIGN DEMO</h1>
    <p class="disclaimer" role="note">Concept demo. Not affiliated with Domino’s Pizza.</p>
  </div>
  <div class="game-shell">
    <canvas id="game" width="320" height="288"></canvas>
    <button id="replay" class="replay">Play Again</button>
    <div class="dpad" aria-label="Directional controls">
      <button class="dpad-button up" data-direction="up" aria-label="Move up">▲</button>
      <button class="dpad-button left" data-direction="left" aria-label="Move left">◀</button>
      <button class="dpad-button right" data-direction="right" aria-label="Move right">▶</button>
      <button class="dpad-button down" data-direction="down" aria-label="Move down">▼</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const replayButton = document.getElementById('replay');
    const dpadButtons = document.querySelectorAll('.dpad-button');
    const DISCLAIMER_TEXT = "Concept demo. Not affiliated with Domino's Pizza.";
    document.querySelector('.disclaimer').textContent = DISCLAIMER_TEXT;

    function createAudio(src, { loop = false, volume = 0.6 } = {}) {
      const audio = new Audio(src);
      audio.crossOrigin = 'anonymous';
      audio.preload = 'auto';
      audio.loop = loop;
      audio.volume = volume;
      audio.load();
      return audio;
    }

    function playAudioInstance(audio) {
      if (!audio) return;
      audio.currentTime = 0;
      const promise = audio.play();
      if (promise && typeof promise.catch === 'function') {
        promise.catch(() => {});
      }
    }

    function stopAudioInstance(audio) {
      if (!audio) return;
      audio.pause();
      audio.currentTime = 0;
    }

    const backgroundMusic = createAudio(
      'https://ctovmhwxjuehichrydrl.supabase.co/storage/v1/object/public/Sounds/background%20sound.mp3',
      { loop: true, volume: 0.35 }
    );
    const gameOverSound = createAudio(
      'https://ctovmhwxjuehichrydrl.supabase.co/storage/v1/object/public/Sounds/Play%20when%20lost.mp3',
      { volume: 0.55 }
    );
    const pizzaCollectedSound = createAudio(
      'https://ctovmhwxjuehichrydrl.supabase.co/storage/v1/object/public/Sounds/Play%20when%20pizza%20catched.mp3',
      { volume: 0.6 }
    );
    const trafficHitSound = createAudio(
      'https://ctovmhwxjuehichrydrl.supabase.co/storage/v1/object/public/Sounds/When%20you%20get%20hit%20by%20traffic.mp3',
      { volume: 0.55 }
    );

    function playBackgroundMusic() {
      if (!backgroundMusic.paused) {
        return;
      }
      const promise = backgroundMusic.play();
      if (promise && typeof promise.catch === 'function') {
        promise.catch(() => {});
      }
    }

    function stopBackgroundMusic() {
      backgroundMusic.pause();
      backgroundMusic.currentTime = 0;
    }

    // Tunable game values
    const PIZZAS_TO_WIN = 10; // Number of pizzas required to win
    const MAX_MISTAKES = 5; // Maximum mistakes before forced restart
    const OBSTACLE_COUNT = 8; // Number of moving car obstacles

    const logoImg = new Image();
    logoImg.crossOrigin = 'anonymous';
    logoImg.src = 'https://ctovmhwxjuehichrydrl.supabase.co/storage/v1/object/public/Imagaes/Dominos_pizza_logo.svg.png';

    const pizzaImg = new Image();
    pizzaImg.crossOrigin = 'anonymous';
    pizzaImg.src = 'https://ctovmhwxjuehichrydrl.supabase.co/storage/v1/object/public/Imagaes/1f355.png';

    let assetsLoaded = 0;
    [logoImg, pizzaImg].forEach((img) => {
      if (img.complete) {
        assetsLoaded += 1;
      } else {
        img.addEventListener('load', () => {
          assetsLoaded += 1;
        });
      }
    });

    const keyState = {
      up: false,
      down: false,
      left: false,
      right: false,
    };

    const keyboardState = {
      up: false,
      down: false,
      left: false,
      right: false,
    };

    const dpadState = {
      up: false,
      down: false,
      left: false,
      right: false,
    };

    const PLAYER_PALETTE = {
      S: '#e0c39a',
      T: '#2b7ce9',
      P: '#333333',
    };

    const PLAYER_SPRITE = [
      '...SSS....',
      '..SSSSS...',
      '..SSSSS...',
      '..SSSSS...',
      '...SSS....',
      '....S.....',
      '..TTTTT...',
      '..TTTTT...',
      '..TTTTT...',
      '..TTTTT...',
      '..PPPPP...',
      '..PPPPP...',
      '.PP...PP..',
      '.PP...PP..',
    ];

    const playerSpriteCanvas = document.createElement('canvas');
    const playerSpriteWidth = PLAYER_SPRITE[0].length;
    const playerSpriteHeight = PLAYER_SPRITE.length;
    playerSpriteCanvas.width = playerSpriteWidth;
    playerSpriteCanvas.height = playerSpriteHeight;
    const playerSpriteCtx = playerSpriteCanvas.getContext('2d');

    PLAYER_SPRITE.forEach((row, y) => {
      for (let x = 0; x < row.length; x += 1) {
        const color = PLAYER_PALETTE[row[x]];
        if (!color) {
          continue;
        }

        playerSpriteCtx.fillStyle = color;
        playerSpriteCtx.fillRect(x, y, 1, 1);
      }
    });

    const player = {
      x: 0,
      y: 0,
      width: 14,
      height: 18,
      speed: 1.4,
      startX: 0,
      startY: 0,
    };

    let pizzas = [];
    let obstacles = [];
    let collected = 0;
    let mistakes = 0;
    let flashTimer = 0;
    let shakeTimer = 0;
    let lastTime = 0;
    let gameState = 'start'; // start, playing, won, lost
    let losePromptBounds = null;

    const WIN_MESSAGE_FONT_SIZE = 7;
    const LOSS_MESSAGE_FONT_SIZE = WIN_MESSAGE_FONT_SIZE * 0.5;

    function initGame() {
      player.startX = canvas.width / 2 - player.width / 2;
      player.startY = canvas.height - 40;
      player.x = player.startX;
      player.y = player.startY;

      window.addEventListener('keydown', (event) => {
        switch (event.key.toLowerCase()) {
          case 'arrowup':
          case 'w':
            keyboardState.up = true;
            keyState.up = true;
            break;
          case 'arrowdown':
          case 's':
            keyboardState.down = true;
            keyState.down = true;
            break;
          case 'arrowleft':
          case 'a':
            keyboardState.left = true;
            keyState.left = true;
            break;
          case 'arrowright':
          case 'd':
            keyboardState.right = true;
            keyState.right = true;
            break;
          case 'enter':
          case ' ':
            if (gameState === 'start') {
              startGame();
            } else if (gameState === 'won' || gameState === 'lost') {
              startGame();
            }
            break;
        }
      });

      window.addEventListener('keyup', (event) => {
        switch (event.key.toLowerCase()) {
          case 'arrowup':
          case 'w':
            keyboardState.up = false;
            keyState.up = keyboardState.up || dpadState.up;
            break;
          case 'arrowdown':
          case 's':
            keyboardState.down = false;
            keyState.down = keyboardState.down || dpadState.down;
            break;
          case 'arrowleft':
          case 'a':
            keyboardState.left = false;
            keyState.left = keyboardState.left || dpadState.left;
            break;
          case 'arrowright':
          case 'd':
            keyboardState.right = false;
            keyState.right = keyboardState.right || dpadState.right;
            break;
        }
      });

      const handleCanvasInteraction = (clientX, clientY) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (clientX - rect.left) * scaleX;
        const y = (clientY - rect.top) * scaleY;

        if (gameState === 'start') {
          startGame();
          return;
        }

        if (gameState === 'lost' && losePromptBounds) {
          const { x: bx, y: by, width, height } = losePromptBounds;
          if (x >= bx && x <= bx + width && y >= by && y <= by + height) {
            startGame();
          }
        }
      };

      canvas.addEventListener('click', (event) => {
        handleCanvasInteraction(event.clientX, event.clientY);
      });

      canvas.addEventListener(
        'touchstart',
        (event) => {
          if (!event.changedTouches.length) return;
          const touch = event.changedTouches[0];
          handleCanvasInteraction(touch.clientX, touch.clientY);
        },
        { passive: true }
      );

      replayButton.addEventListener('click', () => {
        if (gameState === 'won') {
          startGame();
        }
      });

      setupDpadControls();

      requestAnimationFrame(gameLoop);
    }

    function setupDpadControls() {
      if (!dpadButtons.length) {
        return;
      }
      const activeTouchDirections = new Map();
      const buttonByDirection = {};
      const directions = ['up', 'down', 'left', 'right'];

      const activateDirection = (dir, button) => {
        dpadState[dir] = true;
        keyState[dir] = true;
        button.classList.add('pressed');
      };

      const deactivateDirection = (dir, button) => {
        dpadState[dir] = false;
        keyState[dir] = keyboardState[dir] || dpadState[dir];
        button.classList.remove('pressed');
      };

      const resetAllDirections = () => {
        activeTouchDirections.clear();
        directions.forEach((dir) => {
          if (!dpadState[dir]) return;
          dpadState[dir] = false;
          keyState[dir] = keyboardState[dir] || dpadState[dir];
          const button = buttonByDirection[dir];
          if (button) {
            button.classList.remove('pressed');
          }
        });
      };

      dpadButtons.forEach((button) => {
        const dir = button.dataset.direction;
        buttonByDirection[dir] = button;

        const handleMouseDown = (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          activateDirection(dir, button);

          const handleMouseUp = () => {
            deactivateDirection(dir, button);
            window.removeEventListener('mouseup', handleMouseUp);
          };

          window.addEventListener('mouseup', handleMouseUp);
        };

        const handleTouchStart = (event) => {
          event.preventDefault();
          Array.from(event.changedTouches).forEach((touch) => {
            activeTouchDirections.set(touch.identifier, dir);
          });
          activateDirection(dir, button);
        };

        button.addEventListener('mousedown', handleMouseDown);
        button.addEventListener('touchstart', handleTouchStart, { passive: false });
      });

      const handleTouchEnd = (event) => {
        Array.from(event.changedTouches).forEach((touch) => {
          const activeDir = activeTouchDirections.get(touch.identifier);
          if (!activeDir) return;
          activeTouchDirections.delete(touch.identifier);

          const stillActive = Array.from(activeTouchDirections.values()).some(
            (value) => value === activeDir
          );

          if (!stillActive) {
            const button = buttonByDirection[activeDir];
            if (button) {
              deactivateDirection(activeDir, button);
            }
          }
        });
      };

      window.addEventListener('touchend', handleTouchEnd);
      window.addEventListener('touchcancel', handleTouchEnd);
      window.addEventListener('blur', resetAllDirections);
    }

    function startGame() {
      stopAudioInstance(gameOverSound);
      stopAudioInstance(trafficHitSound);
      stopAudioInstance(pizzaCollectedSound);
      resetGameState();
      gameState = 'playing';
      replayButton.style.display = 'none';
      losePromptBounds = null;
      canvas.style.cursor = 'default';
      playBackgroundMusic();
    }

    function resetGameState() {
      collected = 0;
      mistakes = 0;
      pizzas = [];
      obstacles = [];
      flashTimer = 0;
      shakeTimer = 0;
      stopAudioInstance(pizzaCollectedSound);
      player.x = player.startX;
      player.y = player.startY;
      spawnPizza();
      createObstacles();
    }

    function spawnPizza() {
      const safeRadius = 32;
      let attempts = 0;
      let positionValid = false;
      let x = 0;
      let y = 0;

      while (!positionValid && attempts < 200) {
        attempts += 1;
        x = Math.floor(Math.random() * (canvas.width - 24)) + 12;
        y = Math.floor(Math.random() * (canvas.height - 60)) + 24;
        positionValid = true;

        if (
          Math.hypot(player.x + player.width / 2 - x, player.y + player.height / 2 - y) < safeRadius
        ) {
          positionValid = false;
        }

        obstacles.forEach((ob) => {
          if (
            x + 20 > ob.x - safeRadius &&
            x < ob.x + ob.width + safeRadius &&
            y + 20 > ob.y - safeRadius &&
            y < ob.y + ob.height + safeRadius
          ) {
            positionValid = false;
          }
        });
      }

      pizzas = [
        {
          x,
          y,
          size: 20,
        },
      ];
    }

    function createObstacles() {
      for (let i = 0; i < OBSTACLE_COUNT; i += 1) {
        const horizontal = i % 2 === 0;
        const speedBase = 0.6 + Math.random() * 1.2 + i * 0.05;
        const obstacle = horizontal
          ? {
              x: Math.random() * canvas.width,
              y: 40 + i * 24,
              width: 36,
              height: 10,
              dx: speedBase * (Math.random() > 0.5 ? 1 : -1),
              dy: 0,
            }
          : {
              x: 20 + (i % 3) * 80,
              y: Math.random() * canvas.height,
              width: 12,
              height: 38,
              dx: 0,
              dy: speedBase * (Math.random() > 0.5 ? 1 : -1),
            };
        obstacles.push(obstacle);
      }
    }

    function update(delta) {
      if (flashTimer > 0) {
        flashTimer -= delta;
      }
      if (shakeTimer > 0) {
        shakeTimer -= delta;
      }

      if (gameState === 'start' || gameState === 'won' || gameState === 'lost') {
        return;
      }

      handleInput(delta);
      moveObstacles(delta);
      checkPizzaCollection();
      checkObstacleCollision();
    }

    function handleInput(delta) {
      const moveSpeed = player.speed * delta * 0.12;
      let dx = 0;
      let dy = 0;
      if (keyState.left) dx -= moveSpeed;
      if (keyState.right) dx += moveSpeed;
      if (keyState.up) dy -= moveSpeed;
      if (keyState.down) dy += moveSpeed;

      if (dx && dy) {
        dx *= Math.SQRT1_2;
        dy *= Math.SQRT1_2;
      }

      player.x += dx;
      player.y += dy;

      player.x = Math.max(8, Math.min(canvas.width - player.width - 8, player.x));
      player.y = Math.max(32, Math.min(canvas.height - player.height - 8, player.y));
    }

    function moveObstacles(delta) {
      const speedBoost = 1 + collected * 0.05;
      obstacles.forEach((ob) => {
        ob.x += ob.dx * delta * 0.1 * speedBoost;
        ob.y += ob.dy * delta * 0.1 * speedBoost;

        if (ob.dx !== 0) {
          if (ob.x > canvas.width + ob.width) {
            ob.x = -ob.width;
          }
          if (ob.x < -ob.width) {
            ob.x = canvas.width + ob.width;
          }
        }

        if (ob.dy !== 0) {
          if (ob.y > canvas.height + ob.height) {
            ob.y = -ob.height;
          }
          if (ob.y < -ob.height) {
            ob.y = canvas.height + ob.height;
          }
        }
      });
    }

    function checkPizzaCollection() {
      const pizza = pizzas[0];
      if (!pizza) return;

      const collectedPizza =
        player.x < pizza.x + pizza.size &&
        player.x + player.width > pizza.x &&
        player.y < pizza.y + pizza.size &&
        player.y + player.height > pizza.y;

      if (collectedPizza) {
        collected += 1;
        playAudioInstance(pizzaCollectedSound);
        spawnPizza();
        if (collected >= PIZZAS_TO_WIN) {
          gameState = 'won';
          stopBackgroundMusic();
          replayButton.style.display = 'inline-block';
        }
      }
    }

    function checkObstacleCollision() {
      const hit = obstacles.some((ob) =>
        player.x < ob.x + ob.width &&
        player.x + player.width > ob.x &&
        player.y < ob.y + ob.height &&
        player.y + player.height > ob.y
      );

      if (hit) {
        mistakes += 1;
        stopAudioInstance(pizzaCollectedSound);
        playAudioInstance(trafficHitSound);
        flashTimer = 120;
        shakeTimer = 180;
        player.x = player.startX;
        player.y = player.startY;

        if (mistakes >= MAX_MISTAKES) {
          gameState = 'lost';
          stopBackgroundMusic();
          playAudioInstance(gameOverSound);
        }
      }
    }

    function draw(timestamp) {
      const shakeIntensity = shakeTimer > 0 ? (Math.random() - 0.5) * 4 : 0;
      ctx.save();
      if (shakeTimer > 0) {
        ctx.translate(shakeIntensity, shakeIntensity);
      }

      ctx.fillStyle = '#c6d7ad';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawGrid();

      if (gameState !== 'lost') {
        losePromptBounds = null;
        canvas.style.cursor = 'default';
      }

      if (gameState === 'start') {
        drawStartScreen();
      } else {
        drawPizzas();
        drawObstacles();
        drawPlayer();
        drawHud();

        if (flashTimer > 0) {
          const alpha = Math.min(0.35, flashTimer / 300);
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        if (gameState === 'won') {
          drawWinOverlay();
        }

        if (gameState === 'lost') {
          drawLoseOverlay();
        }
      }

      ctx.restore();
    }

    function drawGrid() {
      ctx.strokeStyle = 'rgba(7, 7, 7, 0.08)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= canvas.width; x += 16) {
        ctx.beginPath();
        ctx.moveTo(x + 0.5, 0);
        ctx.lineTo(x + 0.5, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += 16) {
        ctx.beginPath();
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(canvas.width, y + 0.5);
        ctx.stroke();
      }
    }

    function drawStartScreen() {
      ctx.fillStyle = '#1e2a1e';
      ctx.fillRect(24, 32, canvas.width - 48, canvas.height - 96);
      ctx.strokeStyle = '#070707';
      ctx.lineWidth = 3;
      ctx.strokeRect(24, 32, canvas.width - 48, canvas.height - 96);

      if (assetsLoaded >= 2) {
        const logoWidth = 120;
        const logoHeight = 60;
        ctx.drawImage(
          logoImg,
          canvas.width / 2 - logoWidth / 2,
          52,
          logoWidth,
          logoHeight
        );
      }

      ctx.fillStyle = '#f6ffe1';
      ctx.font = '10px "Press Start 2P", "VT323", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText('Collect 10 pizzas.', canvas.width / 2, 138);
      ctx.fillText('Avoid the traffic.', canvas.width / 2, 154);
      drawStartPrompt('Press Enter or Click to Start');
    }

    function drawStartPrompt(message) {
      ctx.save();
      ctx.font = 'bold 8px "Press Start 2P", "VT323", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const metrics = ctx.measureText(message);
      const paddingX = 8;
      const paddingY = 4;
      const textHeight =
        metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent || 16;
      const boxWidth = metrics.width + paddingX * 2;
      const boxHeight = textHeight + paddingY * 2;
      const boxX = (canvas.width - boxWidth) / 2;
      const boxY = canvas.height - boxHeight - 24;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

      ctx.fillStyle = '#000';
      ctx.fillText(message, canvas.width / 2, boxY + boxHeight / 2 + 1);

      ctx.fillStyle = '#fff';
      ctx.fillText(message, canvas.width / 2, boxY + boxHeight / 2);
      ctx.restore();
    }

    function drawHud() {
      ctx.fillStyle = '#1e2a1e';
      ctx.fillRect(0, 0, canvas.width, 28);
      ctx.strokeStyle = '#070707';
      ctx.lineWidth = 2;
      ctx.strokeRect(0, 0, canvas.width, 28);

      if (assetsLoaded >= 2) {
        ctx.drawImage(logoImg, 6, 4, 40, 20);
      }

      ctx.fillStyle = '#f6ffe1';
      ctx.font = '8px "Press Start 2P", "VT323", monospace';
      ctx.textBaseline = 'top';
      ctx.textAlign = 'left';
      ctx.fillText(`Pizzas: ${collected}/${PIZZAS_TO_WIN}`, 54, 6);
      ctx.fillText(`Mistakes: ${mistakes}/${MAX_MISTAKES}`, 190, 6);
    }

    function drawPlayer() {
      const previousSmoothing = ctx.imageSmoothingEnabled;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(
        playerSpriteCanvas,
        Math.round(player.x),
        Math.round(player.y),
        player.width,
        player.height
      );
      ctx.imageSmoothingEnabled = previousSmoothing;
    }

    function drawPizzas() {
      pizzas.forEach((pizza) => {
        if (assetsLoaded >= 2) {
          ctx.drawImage(pizzaImg, Math.round(pizza.x), Math.round(pizza.y), pizza.size, pizza.size);
        } else {
          ctx.fillStyle = '#f6ffe1';
          ctx.fillRect(Math.round(pizza.x), Math.round(pizza.y), pizza.size, pizza.size);
        }
      });
    }

    function drawObstacles() {
      ctx.fillStyle = '#070707';
      obstacles.forEach((ob) => {
        ctx.fillRect(Math.round(ob.x), Math.round(ob.y), ob.width, ob.height);
      });
    }

    function drawWinOverlay() {
      ctx.fillStyle = 'rgba(30, 42, 30, 0.92)';
      ctx.fillRect(32, 64, canvas.width - 64, canvas.height - 128);
      ctx.strokeStyle = '#f6ffe1';
      ctx.lineWidth = 3;
      ctx.strokeRect(32, 64, canvas.width - 64, canvas.height - 128);

      ctx.fillStyle = '#f6ffe1';
      ctx.font = `${WIN_MESSAGE_FONT_SIZE}px "Press Start 2P", "VT323", monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const centerX = canvas.width / 2;
      const baseY = 118;
      const lineSpacing = WIN_MESSAGE_FONT_SIZE + 14;

      ctx.fillText('You Won 10 Large Pizzas!', centerX, baseY);
      ctx.fillText('(Demo only – no real prize.)', centerX, baseY + lineSpacing);
      ctx.fillText('Press Enter or Play Again', centerX, baseY + lineSpacing * 2);
    }

    function drawLoseOverlay() {
      const overlayWidth = canvas.width - 80;
      const overlayHeight = 84;
      const overlayX = (canvas.width - overlayWidth) / 2;
      const overlayY = (canvas.height - overlayHeight) / 2;

      ctx.fillStyle = 'rgba(30, 42, 30, 0.92)';
      ctx.fillRect(overlayX, overlayY, overlayWidth, overlayHeight);
      ctx.strokeStyle = '#f6ffe1';
      ctx.lineWidth = 2;
      ctx.strokeRect(overlayX, overlayY, overlayWidth, overlayHeight);

      ctx.fillStyle = '#f6ffe1';
      ctx.font = `${LOSS_MESSAGE_FONT_SIZE}px "Press Start 2P", "VT323", monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const centerX = canvas.width / 2;
      const verticalSpacing = LOSS_MESSAGE_FONT_SIZE + 6;
      const firstLineY = overlayY + overlayHeight / 2 - verticalSpacing / 2;
      const secondLineY = firstLineY + verticalSpacing;

      ctx.fillText('You lost!', centerX, firstLineY);

      const retryText = 'Press here to try again.';
      ctx.fillText(retryText, centerX, secondLineY);

      const metrics = ctx.measureText(retryText);
      const textHeight =
        metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent || LOSS_MESSAGE_FONT_SIZE;
      losePromptBounds = {
        x: centerX - metrics.width / 2 - 4,
        y: secondLineY - textHeight / 2 - 4,
        width: metrics.width + 8,
        height: textHeight + 8,
      };

      canvas.style.cursor = 'pointer';
    }

    function gameLoop(timestamp) {
      const delta = timestamp - lastTime || 16;
      lastTime = timestamp;

      update(delta);
      draw(timestamp);

      requestAnimationFrame(gameLoop);
    }

    initGame();
  </script>
</body>
</html>
